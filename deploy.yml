name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run tests
      run: pytest test_app.py -v
    
    - name: Build Docker image
      run: |
        docker build -t se-web-app:latest .
    
    - name: Login to Docker Hub (simulated)
      run: echo "Docker login would happen here (network blocked, skipping)"